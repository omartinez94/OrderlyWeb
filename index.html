<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orderlyweb</title>
    <!--
      Pre-hydration theme script. Runs before the module bundle paints so
      the dark-mode-first user never sees a light-mode flash. Mirrors
      the logic in `src/hooks/useTheme.ts`:
        1. Read `localStorage["orderly-theme"]` (light/dark/system).
        2. If unset or 'system', fall back to `matchMedia('(prefers-color-scheme: dark)')`.
        3. Set `data-theme` on <html> synchronously.
      Keep this script INLINE (no external request) and run BEFORE the
      module script below. The values here must stay in sync with
      `src/hooks/useTheme.ts`.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("orderly-theme");
          var resolved;
          if (stored === "light" || stored === "dark") {
            resolved = stored;
          } else if (stored === "system" || stored === null || stored === undefined) {
            var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
            resolved = mq && mq.matches ? "dark" : "light";
          } else {
            resolved = "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (_e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!--
      Pre-hydration language script. Runs synchronously before the
      React bundle paints so the page never flashes the wrong language.
      Mirrors the detector logic in `src/lib/i18n.ts`:
        1. Read `localStorage["orderly-language"]` ("en" | "es").
        2. If unset, fall back to `navigator.languages[0]` /
           `navigator.language` and reduce to the base subtag
           ("es-MX" → "es").
        3. Validate against the supported allowlist; any other value
           falls back to "en".
        4. Set `lang` on <html> synchronously.
      Keep this script INLINE (no external request) and run BEFORE the
      module script below. The values here MUST stay in sync with
      `src/lib/i18n.ts` and `SUPPORTED_LANGUAGES`.
    -->
    <script>
      (function () {
        try {
          var supported = ["en", "es"];
          var stored = window.localStorage.getItem("orderly-language");
          var nav = (window.navigator && (window.navigator.languages && window.navigator.languages[0])) ||
            (window.navigator && window.navigator.language) ||
            "";
          var navLang = nav.split("-")[0].toLowerCase();
          var resolved = supported.indexOf(stored) >= 0
            ? stored
            : supported.indexOf(navLang) >= 0
              ? navLang
              : "en";
          document.documentElement.setAttribute("lang", resolved);
        } catch (_e) {
          document.documentElement.setAttribute("lang", "en");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
